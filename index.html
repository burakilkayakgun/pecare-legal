<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeCare — Legal</title>
  <style>
    :root {
      --primary: #e86a3a;
      --text: #1c1b18;
      --muted: #5c5a54;
      --bg: #fafaf8;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 420px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; color: var(--primary); }
    p { color: var(--muted); margin: 0 0 2rem; }
    nav { display: flex; flex-direction: column; gap: 0.75rem; }
    a {
      display: block;
      padding: 0.875rem 1.25rem;
      background: white;
      border: 1px solid #e8e6e0;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { border-color: var(--primary); color: var(--primary); }
  </style>
</head>
<body>
  <main>
    <h1>PeCare</h1>
    <p>Pet care reminders — legal information</p>
    <nav>
      <a href="terms.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
